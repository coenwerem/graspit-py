name: ci

on:
  push:
  pull_request:

jobs:
  pure-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pytest "mujoco>=3.1"
      - run: PYTHONPATH=$PWD python -m pytest -q tests/test_pure.py tests/test_convert.py tests/test_namespace.py tests/test_dataset.py

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: >
          docker buildx build --load -f docker/Dockerfile
          -t graspit-py .
      - run: docker run --rm graspit-py

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test .github/scripts/wait-for-pages-artifact.test.cjs
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -nW -b html docs docs/_build/html
